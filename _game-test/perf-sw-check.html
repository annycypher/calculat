<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Проверка service-worker: попадает ли статика в кэш</title>
</head>
<body>
<!-- Зачем: проверить исправление «Response.clone() после использования тела» в service-worker.js.
     Смысл проверки: с ошибкой клонирования cache.put() падает, и статика в кэш НЕ попадает —
     это видно снаружи, без чтения консоли service worker.
     ?sw=before — берём старую (сломанную) копию _game-test/sw-before.js, ?sw=after — боевой service-worker.js.
     Результат пишем в DOM, забирает Chrome через --dump-dom. -->
<pre id="out">ждём…</pre>
<script>
var params = new URLSearchParams(location.search);
var which = params.get('sw') || 'after';
var ASSET = '/js/ui-bundle.js?swtest=' + which;
var out = [];
function show() { document.getElementById('out').textContent = out.join('\n'); }
function note(s) { out.push(s); show(); }

if (!('serviceWorker' in navigator)) {
  note('ОШИБКА: браузер не поддерживает service worker — проверка невозможна');
} else {
  run();
}

async function run() {
  try {
    var swUrl = which === 'before' ? '/_game-test/sw-before.js' : '/service-worker.js';
    note('Проверяем: ' + which + ' (' + swUrl + ')');

    /* 1. Регистрация и активация */
    var reg = await navigator.serviceWorker.register(swUrl);
    var ready = await Promise.race([
      navigator.serviceWorker.ready,
      new Promise((res) => setTimeout(() => res(null), 15000))
    ]);
    if (!ready) { note('ПРОВАЛ: service worker не активировался за 15 с'); return; }
    note('Активирован: ' + (ready.active ? ready.active.scriptURL : 'нет active'));

    /* 2. Первый запрос статики — он должен пройти в сеть и попасть в кэш */
    var r1 = await fetch(ASSET, { cache: 'reload' });
    var t1 = await r1.text();
    note('Запрос 1: код ' + r1.status + ', байт ' + t1.length + (r1.ok && t1.length > 0 ? ' — ответ читается' : ' — ПРОВАЛ: ответ пустой'));

    /* 3. Даём service worker положить клон в кэш */
    await new Promise((res) => setTimeout(res, 800));

    /* 4. Главная проверка: есть ли файл в кэше */
    var names = await caches.keys();
    note('Кэши: ' + (names.length ? names.join(', ') : 'нет ни одного'));
    var found = null;
    for (var i = 0; i < names.length; i++) {
      var c = await caches.open(names[i]);
      var keys = await c.keys();
      for (var j = 0; j < keys.length; j++) {
        if (keys[j].url.indexOf('/js/ui-bundle.js') !== -1) { found = names[i]; }
      }
    }
    note('Статика в кэше: ' + (found ? 'да (' + found + ')' : 'НЕТ'));

    /* 5. Второй запрос — должен прийти из кэша и остаться читаемым */
    var r2 = await fetch(ASSET);
    var t2 = await r2.text();
    note('Запрос 2: код ' + r2.status + ', байт ' + t2.length + (r2.ok && t2.length > 0 ? ' — ответ читается' : ' — ПРОВАЛ'));

    note('ИТОГ: ' + (found ? 'статика кэшируется — clone() сделан вовремя' : 'статика НЕ кэшируется — ошибка клонирования воспроизвелась'));

    /* 6. Уборка: снимаем регистрацию, чтобы не мешать другим проверкам */
    try { await reg.unregister(); note('Регистрация снята (уборка)'); } catch (e) {}
  } catch (e) {
    note('СБОЙ ПРОВЕРКИ: ' + (e && e.message ? e.message : String(e)));
  }
}
</script>
</body>
</html>
