<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Проверка F3: JS главной после правок компоновки</title>
</head>
<body>
<!-- Зачем: после правок против «принудительной компоновки» убеждаемся, что главная работает:
     нет ошибок JS, наклон стекла и «липучка» рекламы живы, калькулятор считает.
     Результат пишем в DOM, забирает Chrome через --dump-dom. На сайт файл не влияет. -->
<pre id="out">ждём…</pre>
<script>
var out = [], errors = [];
function show() { document.getElementById('out').textContent = out.join('\n'); }
function step(name, fn) { try { fn(); } catch (e) { out.push(name + ': СБОЙ — ' + (e && e.message ? e.message : String(e))); } show(); }

var f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0;position:absolute;left:-99999px;top:0';
f.src = '/index.html';
document.body.appendChild(f);

f.addEventListener('load', function () {
  var w = f.contentWindow, d = f.contentDocument;
  var tiltEl = null;
  out.push('кадр загружен'); show();
  try { w.addEventListener('error', function (e) { errors.push(e.message); }); } catch (e) { errors.push('нет доступа к окну'); }

  function tiltTest(n) {
    step('2. Наклон (попытка ' + n + ')', function () {
      tiltEl = tiltEl || d.querySelector('.tilt');
      if (!tiltEl) { out.push('2. Наклон: элементов .tilt нет — проверять нечего'); return; }
      tiltEl.dispatchEvent(new w.MouseEvent('mouseenter', { clientX: 10, clientY: 10 }));
      tiltEl.dispatchEvent(new w.MouseEvent('mousemove', { bubbles: true, clientX: 60, clientY: 30 }));
    });
    setTimeout(function () {
      var tr = tiltEl ? tiltEl.style.transform : '';
      step('2б. Результат попытки ' + n, function () {
        out.push('2б. transform = [' + tr + ']' + (tr ? ' — наклон работает' : ' — пусто'));
      });
      if (!tiltEl || tr) { stickyTest(); return; }
      if (n < 3) { tiltTest(n + 1); return; }
      out.push('2г. Наклон не подтвердился за 3 попытки — надо проверить вручную в браузере'); show();
      stickyTest();
    }, 600);
  }

  function stickyTest() {
    var st = d.querySelector('.ad-mobile-sticky');
    step('3. Липучка рекламы', function () {
      if (!st) { out.push('3. Блока .ad-mobile-sticky на странице нет (реклама выключена) — проверять нечего'); return; }
      var h = d.documentElement.scrollHeight - w.innerHeight;
      w.scrollTo(0, Math.max(1, Math.round(h * 0.6)));
      w.dispatchEvent(new w.Event('scroll'));
    });
    setTimeout(function () {
      step('3б. Результат липучки', function () {
        var v = st ? st.getAttribute('data-ad-visible') : null;
        out.push('3б. data-ad-visible = ' + (v === null ? 'нет' : v)
          + (v === '1' ? ' — сработала' : ' — норма, если реклама выключена'));
      });
      calcTest();
    }, 400);
  }

  function calcTest() {
    step('4. Калькулятор на главной', function () {
      var sum = d.getElementById('mSum'), rate = d.getElementById('mRate'), term = d.getElementById('mTerm');
      if (!sum || !rate || !term) { out.push('4. Полей калькулятора нет — пропуск'); return; }
      sum.value = '3000000'; rate.value = '12'; term.value = '20';
      [sum, rate, term].forEach(function (el) {
        ['input', 'change', 'keyup'].forEach(function (t) { el.dispatchEvent(new w.Event(t, { bubbles: true })); });
      });
    });
    setTimeout(function () {
      step('4б. Результат расчёта', function () {
        var pay = d.getElementById('mPay');
        var text = pay ? (pay.value || pay.textContent || '') : '';
        out.push('4б. Платёж = ' + (text || '(пусто)') + (/[0-9]/.test(text) ? ' — считает' : ' — ПРОВАЛ'));
        out.push('5. Ошибки JS за проверку: ' + (errors.length ? errors.join('; ') : 'нет'));
        out.push('ИТОГ: ' + (errors.length === 0 ? 'ошибок нет, страница работает' : 'есть ошибки — разобрать'));
      });
    }, 400);
  }

  setTimeout(function () { tiltTest(1); }, 800);
});
</script>
</body>
</html>
