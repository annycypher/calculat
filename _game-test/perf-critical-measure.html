<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Замер критического CSS (любая страница)</title>
</head>
<body>
<!-- Зачем: оценить размер критического CSS ДО встройки (задача 1 ТЗ по скорости, 25.09.2026).
     Отличие от perf-critical-extract.html: страницу задаёт параметр ?u=/путь/index.html, поэтому инструмент
     работает для любого типа (главная, калькулятор, конвертер, генератор, статья), а в отчёте — байты,
     число правил и разбивка по группам (где именно сидят байты).
     Ничего не меняет: только читает стили в двух окнах — мобильном (390) и настольном (1280).
     Запуск: powershell -NoProfile -ExecutionPolicy Bypass -File _game-test\perf-measure-critical.ps1 -->
<pre id="out">ждём…</pre>
<script>
var q = new URLSearchParams(location.search);
var url = q.get('u') || '/index.html';
var widths = [390, 1280];
var heights = [844, 900];
var frames = [], ready = 0, out = [], need = [{}, {}], collected = [], seen = {},
    usedRules = 0, totalRules = 0, groupBytes = {}, groupRules = {};

function inViewport(el, vh, vw) {
  var r = el.getBoundingClientRect();
  return r.height > 0 && r.width > 0 && r.top < vh + 300 && r.bottom > -300 && r.right > -50 && r.left < vw + 50;
}

function groupOf(sel) {
  if (/header\.app-header/.test(sel)) { return 'шапка'; }
  if (/\.btn|\.icon-btn|\.eyebrow|\.chip|\.badge|\.pill/.test(sel)) { return 'кнопки/метки'; }
  if (/\.card|\.input|\.field|\.select|\.form|\.label|\.check/.test(sel)) { return 'карточки/формы'; }
  if (/\.container|\.section|\.hero|\.grid|wrap|\.crumbs|breadcrumb/.test(sel)) { return 'каркас/секции'; }
  if (/:root|^\*|^html|^body|selection/.test(sel)) { return 'базовое/переменные'; }
  if (/footer/.test(sel)) { return 'подвал'; }
  if (/\.ad-|ad-slot|ad_/.test(sel)) { return 'реклама'; }
  return 'прочее';
}

function walk(rules, idx, doc, win) {
  for (var i = 0; i < rules.length; i++) {
    var r = rules[i];
    if (idx === 0) { totalRules++; }
    if (r.type === 1) {
      var parts = (r.selectorText || '').split(','), hit = false;
      for (var p = 0; p < parts.length && !hit; p++) {
        var one = parts[p].trim();
        if (!one) { continue; }
        try {
          var list = doc.querySelectorAll(one);
          for (var j = 0; j < list.length; j++) {
            if (inViewport(list[j], win.innerHeight, win.innerWidth)) { hit = true; break; }
          }
        } catch (e) { /* служебные селекторы пропускаем */ }
      }
      if (hit) { need[idx][r.cssText] = 1; }
    } else if (r.type === 4 && r.media && r.cssRules) {
      var ok = false;
      try { ok = win.matchMedia(r.media.mediaText).matches; } catch (e) { ok = false; }
      if (ok) { walk(r.cssRules, idx, doc, win); }
    }
  }
}

widths.forEach(function (w, idx) {
  var f = document.createElement('iframe');
  f.style.cssText = 'width:' + w + 'px;height:' + heights[idx] + 'px;border:0;position:absolute;left:-99999px;top:0';
  f.src = url;
  f.addEventListener('load', function () {
    setTimeout(function () {
      var doc = f.contentDocument, win = f.contentWindow;
      /* Важно: на главной bundle.css подключён как media="print" — для замера включаем его на экран,
         иначе раскладка первого экрана посчитается без этих стилей. */
      var links = doc.querySelectorAll('link[rel="stylesheet"][media="print"]');
      for (var t = 0; t < links.length; t++) { links[t].media = 'all'; }
      setTimeout(function () {
        var sheets = doc.styleSheets, found = 0;
        for (var s = 0; s < sheets.length; s++) {
          if ((sheets[s].href || '').indexOf('bundle.css') === -1) { continue; }
          found++;
          try { walk(sheets[s].cssRules, idx, doc, win); } catch (e) { out.push('ОШИБКА ЧТЕНИЯ: ' + e.message); }
        }
        out.push('окно ' + win.innerWidth + 'px: листов bundle.css ' + found + ', нужных правил ' + Object.keys(need[idx]).length);
        ready++;
        if (ready === widths.length) { finish(); }
      }, 600);
    }, 2500);
  });
  document.body.appendChild(f);
  frames.push(f);
});

/* Финальный проход: идём по правилам bundle.css в исходном порядке — порядок в файле сохраняем, чтобы каскад не поехал. */
function finish() {
  var doc = frames[0].contentDocument, sheets = doc.styleSheets;
  for (var s = 0; s < sheets.length; s++) {
    if ((sheets[s].href || '').indexOf('bundle.css') === -1) { continue; }
    var rules = sheets[s].cssRules;
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      if (r.type === 1) {
        if (need[0][r.cssText] || need[1][r.cssText]) { push(r.cssText); }
      } else if (r.type === 4 && r.media && r.cssRules) {
        var inner = '';
        for (var k = 0; k < r.cssRules.length; k++) {
          if (need[0][r.cssRules[k].cssText] || need[1][r.cssRules[k].cssText]) { inner += r.cssRules[k].cssText; }
        }
        if (inner !== '') { push('@media ' + r.media.mediaText + '{' + inner + '}'); }
      }
    }
  }
  var css = collected.join('\n');
  var mini = css.replace(/\s+/g, ' ').replace(/\s*([{}:;,>])\s*/g, '$1').replace(/;}/g, '}').trim();
  out.push('правил просмотрено: ' + totalRules + ', отобрано: ' + usedRules);
  out.push('РАЗМЕР критического CSS: ' + css.length + ' Б (' + (css.length / 1024).toFixed(1) + ' КБ), сжатый пробелами: '
    + mini.length + ' Б (' + (mini.length / 1024).toFixed(1) + ' КБ)');
  for (var g in groupBytes) { out.push('  ' + g + ': ' + groupBytes[g] + ' Б, правил ' + groupRules[g]); }
  out.push('BASE64=' + btoa(unescape(encodeURIComponent(css))));
  document.getElementById('out').textContent = out.join('\n');

  function push(text) {
    if (seen[text]) { return; }
    seen[text] = 1; collected.push(text); usedRules++;
    var g = groupOf((text.split('{')[0] || '').trim());
    groupBytes[g] = (groupBytes[g] || 0) + text.length;
    groupRules[g] = (groupRules[g] || 0) + 1;
  }
}
</script>
</body>
</html>
